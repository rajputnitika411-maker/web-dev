<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css box model</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box1{
          background-color: lightgreen;
          color: white;
          padding: 20px;
          margin : 35px;
          border:2px solid black;
          height: 50px;
          box-sizing: border-box;
        }
        .box2{
          background-color:lightgreen;
          color:rgb(83, 13, 13) ;
            padding: 20px;
            margin : 25px;
            border:2px solid black;
           height: 100px; 
           box-sizing:border-box;
     }
    </style>
</head>
<body>
    <div class="box box1"> hey this is a box.</div>
    <div class="box box2"> hey this is a box.</div>
</body>
</html>
