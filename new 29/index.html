<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css multicolor websites</title>
    <style>
        /* :root { 
            --primary-color: #ad5afaac;
            --text-color: white;
            --secondary-color: #dbcee7ac;
    } */
        :root {
            --primary-color: #5ffa5aac;
            --text-color: white;
            --secondary-color: #cee7deac;
        }

 

        body {
            background-color: var(--secondary-color);
        }

        * {
            margin: 0;
            padding: 0;
        }

        ul li {
            list-style: none;
            display: inline;
            padding: 23px;
            font-weight: bolder;
            color: var(--text-color);
        }

        nav {
            background-color: var(--primary-color);
             padding: 12px 0;

        }
        ul li a{
              color: var(--text-color);
              text-decoration: none;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">home</a></li>
                <li><a href="/">about</a></li>
                <li><a href="/">services</a></li>
                <li><a href="/"> contact us</a></li>
            </ul>
        </nav>
    </header>

</body>

</html>
