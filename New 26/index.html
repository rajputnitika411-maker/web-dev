<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card design</title>
    <style>
        *{ margin:0;
            padding:0;
        }
        body {
            background-color: gray;
            padding:45px;
        }

        .card {
            background-color: white;
            width: 198px;
            border-radius: 7px;
            padding: 0 0 34px 0;

        }

        .image {
            padding: 5px;
        }

        .image img {
            border-radius: 7px;
        }

        .content{ padding:7px 13px;

        } 
        .content p{
            font-size: 13px;
            color:gray;
        }
        .capsules
        {
            padding:0 34px 0 14px;
        }
        .capsules span{
            border: 2px solid black;
            padding: 1px 4px;
            border-radius:7px;
            font-size:12px;

        }
        .button{
            text-align:center;
        }
        .button button{ 
            padding:0px 13px;
            border-radius:9px;
            background-color: aqua;
            color:blue;
         font-size:12px;
         border:none;
        }
   
    </style>
</head>

<body>
    <div class="card">

        <div class="image">
        <img width="188" src="Amazingg!!💖💖.jpeg">
    </div>

    <div class="capsules">
