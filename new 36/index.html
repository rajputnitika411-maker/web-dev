<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css transforms</title>
<style>
.box{
    height:50px;
    width:50px;
    background-color: aquamarine;
    border:2px solid black;
 transform:rotate(0.125turn);
 transform-origin: -50% -50%;
 /* transform:rotatey(40deg); */
 /* transform:skew(5deg); */
/* transform: translateX(100%) skew(45deg) translateX(-35%); */
 display:flex;
 justify-content:center;
align-items:center;
}
.container{
    width:100vw;
    height:80vh;
    border:2px solid purple;
}
</style>
</head>
<body>
    <div class="container">
        <div class="box">
box
        </div>
    </div>
</body>
</html>
