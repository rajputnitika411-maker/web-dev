<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css grid</title>
    <style>
        .container {
            width: 80vw;
            height: 50vh;
            border: 2px solid rgb(24, 24, 8);
            display: grid;
            /* grid-template-columns: repeat(4,minmax(100px,1fr)); */
            grid-template-columns: repeat(2,minmax(100px,40px));
            /* gap:34px; */
            row-gap:10px;
            column-gap:44px;
            justify-items:center;
            align-items:center;
        }

        .item {
            border: 2px solid red;
            height: 55px;
            width: 55px;
        }

        .item-4 {}

        .item-1 {}
    </style>
</head>

<body>
    <div class="container">
        <div class="item item-1">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item item-4">4</div>
        <div class="item">5</div>

    </div>
</body>

</html>
